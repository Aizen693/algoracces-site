<!DOCTYPE html>
<!-- Page construite par fusion/outils/construire-argos.mjs à partir de fusion/bac-a-sable/index.html. Ne pas la modifier à la main. -->
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Argos, recherche : Algor Acces</title>
<meta name="description" content="Argos, l'assistant de renseignement d'Algor Acces. Réservé aux abonnés." />
<link rel="icon" type="image/jpeg" href="/favicon.jpg" />
<link rel="stylesheet" href="/shared/home/fonts-display.css?v=20261104c" />
<link rel="stylesheet" href="/shared/v5/v5.css?v=20261104c" />
<style>
  /* Bac à sable, v4 : un graphe d'enquête. On donne un flux HUMINT, l'outil cherche les sources publiques
     qui en parlent, et le graphe pousse autour du flux : faits, flux OSINT de chaque fait, sources avec leur image.
     On déplace les pastilles, on glisse le fond, on zoome à la molette. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  button, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .bs-barre { flex: none; z-index: 5; display: flex; align-items: center; gap: 20px; padding: 12px var(--gutter); background: var(--paper); border-bottom: 1px solid var(--line); }
  .bs-barre h1 { margin: 0; font-weight: 500; font-size: 16px; white-space: nowrap; }
  .bs-etat { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 14px; color: var(--muted); }
  .bs-etat span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bs-point { flex: none; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: bs-pouls 1s ease-in-out infinite; }
  @keyframes bs-pouls { 50% { opacity: .2; } }
  .bs-btn { padding: 9px 14px; border: 1px solid var(--ink); background: var(--paper); font-size: 14px; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
  .bs-btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .bs-btn[data-plein] { background: var(--ink); color: var(--paper); }
  .bs-btn[data-plein]:hover:not(:disabled) { background: var(--ink-2); }
  .bs-btn:disabled { border-color: var(--line); background: var(--paper); color: var(--faint); cursor: not-allowed; }
  .bs-btn:focus-visible, textarea:focus-visible, .bs-outils button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  /* ---------- étape 1 : donner le flux HUMINT ---------- */
  .bs-saisie { width: 100%; max-width: 760px; box-sizing: border-box; margin: 0 auto; padding: clamp(32px, 7vh, 80px) var(--gutter) 48px; }
  .bs-saisie h2 { margin: 0 0 12px; font-weight: 400; font-size: clamp(30px, 4vw, 48px); line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance; }
  .bs-saisie p { margin: 0 0 22px; max-width: 60ch; font-size: 17px; line-height: 1.5; color: var(--ink-2); }
  .bs-saisie textarea { display: block; width: 100%; height: 240px; box-sizing: border-box; padding: 16px; border: 1px solid var(--ink); border-radius: 0; background: var(--paper); font-size: 15px; line-height: 1.5; resize: vertical; }
  .bs-recents { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .bs-recents button { padding: 5px 9px; border: 1px solid var(--line); background: var(--paper); font-size: 13px; cursor: pointer; }
  .bs-recents button:hover { border-color: var(--ink); }
  .bs-pays { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .bs-pays input { width: 160px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 0; background: var(--paper); font: inherit; color: var(--ink); }
  .bs-pays input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .bs-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
  .bs-question { display: flex; gap: 10px; margin: 0 0 14px; }
  .bs-question input { flex: 1; min-width: 0; padding: 14px 16px; border: 1px solid var(--ink); border-radius: 0; background: var(--paper); font: inherit; font-size: 16px; color: var(--ink); }
  .bs-question input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .bs-ou { margin: 34px 0 10px !important; font-size: 13px !important; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) !important; }
  /* la réponse à la question : une carte claire posée sur l'arbre, reliée à Algor */
  .bs-rep { position: absolute; left: -1130px; top: 300px; width: 800px; box-sizing: border-box; padding: 22px 24px 18px; background: var(--paper); color: var(--ink); border: 2px solid var(--on-night); cursor: default; animation: bs-pousse .5s var(--ease) backwards; }
  .bs-rep-cols { display: grid; grid-template-columns: 290px 1fr; gap: 26px; align-items: start; }
  .bs-rep-chiffres { flex-direction: column; }
  .bs-rep h3 { margin: 0 0 4px; font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .bs-rep .bs-rep-q { margin: 0 0 16px; font-size: 15px; line-height: 1.35; }
  .bs-rep-chiffres { display: flex; gap: 14px; margin: 0 0 14px; padding: 12px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); }
  .bs-rep-chiffres div { font-size: 12px; line-height: 1.3; color: var(--muted); }
  .bs-rep-chiffres b { display: block; font-size: 34px; font-weight: 400; line-height: 1; letter-spacing: -0.03em; color: var(--ink); }
  .bs-rep table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 13px; }
  .bs-rep td { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .bs-rep td:first-child { white-space: nowrap; padding-right: 10px; }
  .bs-rep td + td { text-align: right; color: var(--muted); }
  .bs-rep-cols > div > h4:first-child { margin-top: 0; }
  .bs-rep h4 { margin: 14px 0 6px; font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
  .bs-rep ul { margin: 0; padding: 0; list-style: none; }
  .bs-rep li { margin: 0 0 8px; font-size: 14px; line-height: 1.42; }
  .bs-rep li button { margin-left: 6px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 0; background: none; font: inherit; font-size: 11px; color: var(--muted); cursor: pointer; }
  .bs-rep li button:hover { border-color: var(--ink); color: var(--ink); }
  .bs-rep .bs-rep-lim li { font-size: 13px; color: var(--muted); }
  .bs-rep .bs-rep-pied { margin: 14px 0 0; font-size: 11px; color: var(--muted); }
  .bs-q { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 3; max-width: min(760px, 78%); margin: 0; padding: 9px 16px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(10, 10, 12, .82); color: var(--on-night); font-size: 14px; line-height: 1.4; text-align: center; text-wrap: balance; }
  .bs-q small { display: block; margin-top: 3px; opacity: .62; font-size: 12px; }
  .bs-note { margin: 14px 0 0 !important; font-size: 13px !important; color: var(--muted) !important; }

  /* ---------- étape 2 : le graphe ---------- */
  .bs-toile { position: relative; flex: 1; min-height: 0; overflow: hidden; background-color: var(--night); background-image: radial-gradient(rgba(255, 255, 255, .09) 1px, transparent 1px); background-size: 26px 26px; color: var(--on-night); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .bs-toile[data-glisse] { cursor: grabbing; }
  .bs-monde { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform .7s var(--ease); }
  .bs-toile[data-main] .bs-monde { transition: none; }
  .bs-liens { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .bs-liens line { stroke: rgba(255, 255, 255, .34); stroke-width: 1.2; stroke-dasharray: 1; stroke-dashoffset: 1; animation: bs-trait .55s var(--ease) forwards; }
  .bs-liens line[data-faible] { stroke: rgba(255, 255, 255, .14); }
  @keyframes bs-trait { to { stroke-dashoffset: 0; } }

  .bs-nd { position: absolute; width: 0; height: 0; }
  .bs-rond { position: absolute; left: 0; top: 0; display: grid; place-items: center; box-sizing: border-box; padding: 0; border: 2px solid var(--on-night); border-radius: 50%; background: var(--night-2); color: var(--on-night); overflow: hidden; cursor: pointer; transform: translate(-50%, -50%); animation: bs-pousse .45s var(--ease) backwards; transition: border-color .3s, background .3s, box-shadow .2s, opacity .3s; }
  @keyframes bs-pousse { from { opacity: 0; transform: translate(-50%, -50%) scale(.3); } }
  .bs-rond:hover, .bs-nd[data-choisi] .bs-rond { box-shadow: 0 0 0 5px rgba(255, 255, 255, .16); }
  .bs-rond:focus-visible { outline: 2px solid var(--on-night); outline-offset: 3px; }
  .bs-rond svg { width: 46%; height: 46%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .bs-rond img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; animation: bs-fondu .5s; }
  @keyframes bs-fondu { from { opacity: 0; } }
  .bs-rond b { font-weight: 500; font-size: 15px; letter-spacing: .02em; }
  .bs-lib { position: absolute; left: 0; width: 132px; margin-left: -66px; text-align: center; pointer-events: none; animation: bs-fondu .6s backwards; }
  .bs-lib strong { display: block; font-weight: 500; font-size: 12px; line-height: 1.25; color: var(--on-night); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bs-lib small { display: block; margin-top: 1px; font-size: 11px; color: var(--on-night-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bs-nd[data-genre="algor"] .bs-rond { width: 96px; height: 96px; background: var(--on-night); color: var(--night); }
  .bs-nd[data-genre="algor"] .bs-lib { top: 56px; }
  .bs-nd[data-genre="algor"] .bs-lib strong { font-size: 15px; }
  .bs-nd[data-genre="pilier"] .bs-rond { width: 70px; height: 70px; background: var(--on-night); color: var(--night); }
  .bs-nd[data-genre="pilier"] .bs-lib { top: 43px; }
  .bs-nd[data-genre="pilier"] .bs-lib strong { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  .bs-nd[data-genre="flux"] .bs-rond { width: 52px; height: 52px; }
  .bs-nd[data-genre="flux"] .bs-lib { top: 33px; }
  .bs-nd[data-genre="fait"] .bs-rond { width: 60px; height: 60px; }
  .bs-nd[data-genre="fait"] .bs-lib { top: 37px; width: 104px; margin-left: -52px; }
  .bs-nd[data-genre="agent"] .bs-rond { width: 60px; height: 60px; }
  .bs-nd[data-genre="agent"] .bs-lib { top: 37px; }
  .bs-nd[data-genre="sortie"] .bs-rond { width: 70px; height: 70px; }
  .bs-nd[data-genre="sortie"] .bs-lib { top: 43px; }
  /* états communs : en attente (pointillés), en cours (halo qui bat), abouti (plein), sans résultat (pointillés) */
  .bs-nd[data-etat="attente"] .bs-rond { border-style: dashed; border-color: rgba(255, 255, 255, .3); color: rgba(255, 255, 255, .4); }
  .bs-nd[data-etat="attente"] .bs-lib { opacity: .55; }
  .bs-nd[data-etat="cours"] .bs-rond { animation: bs-pousse .45s var(--ease) backwards, bs-cherche 1.1s ease-in-out infinite; }
  @keyframes bs-cherche { 50% { box-shadow: 0 0 0 10px rgba(255, 255, 255, .13); } }
  .bs-nd[data-etat="trouve"] .bs-rond { background: var(--on-night); color: var(--night); }
  /* recoupement à confirmer : pastille à moitié pleine */
  .bs-nd[data-etat="partiel"] .bs-rond { background: linear-gradient(90deg, var(--on-night) 50%, var(--night-2) 50%); color: var(--muted); }
  .bs-nd[data-genre="source"][data-qualite="ecartee"] .bs-rond { opacity: .32; border-style: dashed; }
  .bs-nd[data-genre="source"][data-qualite="ecartee"] .bs-lib { opacity: .45; }
  .bs-nd[data-genre="source"][data-qualite="ecartee"] .bs-lib strong { text-decoration: line-through; }
  .bs-nd[data-etat="rien"] .bs-rond { border-style: dashed; border-color: rgba(255, 255, 255, .45); color: rgba(255, 255, 255, .6); }
  /* liens croisés (un fait et la source ou la connaissance qui l'éclaire) : masqués par défaut pour garder le graphe lisible,
     montrés un instant à leur création, puis au survol ou au clic d'une pastille */
  .bs-liens path[data-croise] { fill: none; stroke: var(--on-night); stroke-width: 1.4; opacity: 0; transition: opacity .35s; }
  .bs-liens path[data-croise][data-montre] { opacity: .85; }
  .bs-nd { transition: opacity .3s; }
  .bs-toile[data-focus] .bs-nd:not([data-lie]) { opacity: .16; }
  .bs-toile[data-focus] .bs-liens line { opacity: .25; }
  .bs-nd[data-genre="savoir"] .bs-rond { width: 50px; height: 50px; border-color: rgba(255, 255, 255, .6); }
  .bs-nd[data-genre="savoir"] .bs-lib { top: 31px; width: 104px; margin-left: -52px; }
  .bs-nd[data-genre="savoir"] .bs-lib strong { font-weight: 400; }
  /* une fiche de la base de connaissance : plus grande et cerclée en plein, c'est du savoir durable */
  .bs-nd[data-genre="savoir"][data-base] .bs-rond { width: 62px; height: 62px; border-color: var(--on-night); border-width: 2.5px; }
  .bs-nd[data-genre="savoir"][data-base] .bs-lib { top: 38px; }
  .bs-nd[data-genre="savoir"][data-base] .bs-lib strong { font-weight: 500; }
  .bs-fiche li small a { color: var(--muted); }
  .bs-nd[data-genre="source"] .bs-rond { width: 56px; height: 56px; border-color: rgba(255, 255, 255, .55); }
  .bs-nd[data-genre="source"] .bs-lib { top: 34px; width: 96px; margin-left: -48px; }
  .bs-nd[data-genre="source"][data-verif="cours"] .bs-rond { animation: bs-pousse .45s var(--ease) backwards, bs-cherche 1.1s ease-in-out infinite; }
  .bs-nd[data-genre="source"][data-verif="validee"] .bs-rond { border-color: var(--on-night); }
  .bs-nd[data-genre="source"][data-verif="rejetee"] .bs-rond { opacity: .32; border-style: dashed; }
  .bs-nd[data-genre="source"][data-verif="rejetee"] .bs-lib { opacity: .45; }
  .bs-nd[data-genre="source"][data-verif="rejetee"] .bs-lib strong { text-decoration: line-through; }
  /* petite marque de vérification, en haut à droite de la pastille */
  .bs-marque { position: absolute; left: 14px; top: -32px; display: grid; place-items: center; min-width: 18px; height: 18px; padding: 0 3px; box-sizing: border-box; border-radius: 50%; background: var(--on-night); color: var(--night); font-size: 11px; font-weight: 500; pointer-events: none; animation: bs-pousse2 .3s var(--ease); }
  @keyframes bs-pousse2 { from { transform: scale(0); } }

  .bs-outils { position: absolute; left: 16px; bottom: 16px; z-index: 2; display: flex; gap: 6px; }
  .bs-outils button { min-width: 36px; height: 36px; padding: 0 10px; border: 1px solid var(--line-night); background: var(--night-2); color: var(--on-night); font-size: 14px; cursor: pointer; }
  .bs-outils button:hover { border-color: var(--on-night); }
  .bs-aide { position: absolute; right: 16px; bottom: 16px; z-index: 1; margin: 0; font-size: 12px; color: var(--on-night-2); pointer-events: none; }

  /* fiche de détail, à droite */
  .bs-fiche { position: absolute; right: 0; top: 0; bottom: 0; z-index: 3; width: min(380px, 100%); box-sizing: border-box; padding: 0 0 24px; overflow-y: auto; background: var(--paper); color: var(--ink); border-left: 1px solid var(--line); cursor: auto; user-select: text; -webkit-user-select: text; animation: bs-glisse .3s var(--ease); }
  @keyframes bs-glisse { from { opacity: 0; transform: translateX(24px); } }
  .bs-fiche figure { margin: 0; background: var(--band); }
  .bs-fiche figure img { display: block; width: 100%; max-height: 210px; object-fit: cover; }
  .bs-fiche header { display: flex; justify-content: space-between; align-items: start; gap: 14px; padding: 18px 20px 0; }
  .bs-fiche h3 { margin: 0; font-weight: 500; font-size: 19px; line-height: 1.3; }
  .bs-fiche header small { display: block; margin-bottom: 4px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .bs-fiche p { margin: 14px 20px 0; font-size: 15px; line-height: 1.5; color: var(--ink-2); overflow-wrap: anywhere; }
  .bs-fiche p b { display: block; font-weight: 400; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .bs-fiche a { color: var(--ink); }
  .bs-fiche ul { margin: 6px 20px 0; padding: 0; list-style: none; }
  .bs-fiche li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.5; color: var(--ink-2); }
  .bs-fiche li small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
  /* question posée à un agent hébergé sur Hermès */
  .bs-ask { margin: 22px 20px 0; padding-top: 18px; border-top: 1px solid var(--ink); }
  .bs-ask h4 { margin: 0 0 4px; font-weight: 500; font-size: 15px; }
  .bs-ask > small { display: block; margin-bottom: 12px; font-size: 13px; line-height: 1.45; color: var(--muted); }
  .bs-ask select, .bs-ask textarea { display: block; width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 0; background: var(--paper); font: inherit; font-size: 14px; color: var(--ink); }
  .bs-ask textarea { height: 64px; resize: vertical; }
  .bs-ask select:focus-visible, .bs-ask textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .bs-ask .bs-btn { width: 100%; }
  .bs-agents { display: flex; flex-wrap: wrap; gap: 6px; }
  .bs-agents .bs-btn { width: auto; padding: 7px 10px; font-size: 13px; }
  .bs-rep { margin-top: 16px; padding: 14px; background: var(--band); font-size: 14px; line-height: 1.55; color: var(--ink-2); overflow-wrap: anywhere; }
  .bs-rep header { display: block; padding: 0; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .bs-rep p { margin: 0 0 8px; font-size: 14px; }
  .bs-rep p.t { font-weight: 500; color: var(--ink); margin-top: 12px; }
  .bs-rep p.l { padding-left: 14px; text-indent: -14px; }
  .bs-rep code { font: inherit; font-size: 12px; color: var(--muted); }
  /* onglets : le graphe, puis les trois sorties d'Algor */
  .bs-onglets { display: flex; gap: 2px; }
  .bs-onglets button { padding: 8px 14px; border: 0; border-bottom: 2px solid transparent; background: none; font-size: 14px; color: var(--muted); cursor: pointer; }
  .bs-onglets button:hover { color: var(--ink); }
  .bs-onglets button[aria-selected="true"] { border-bottom-color: var(--ink); color: var(--ink); font-weight: 500; }
  .bs-onglets button:disabled { color: var(--faint); cursor: default; }
  .bs-vue { flex: 1; min-height: 0; overflow-y: auto; }
  .bs-vue-carte { position: relative; background: var(--night); overflow: hidden; }
  .bs-vue-carte #bs-carte { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--paper); }
  .bs-legende { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 5; margin: 0; padding: 6px 12px; background: var(--night); color: var(--on-night); font-size: 13px; pointer-events: none; }
  .bs-legende:empty { display: none; }
  .bs-legende i { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border: 2px solid var(--on-night); border-radius: 50%; vertical-align: -1px; }
  .bs-legende i[data-plein] { background: var(--on-night); }
  .bs-page { max-width: 820px; margin: 0 auto; padding: 32px var(--gutter) 80px; }
  .bs-page h2 { margin: 0 0 6px; font-weight: 400; font-size: clamp(28px, 3.4vw, 42px); line-height: 1.08; letter-spacing: -0.03em; }
  .bs-page .bs-chapo { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
  .bs-page h3 { margin: 34px 0 10px; padding-top: 14px; border-top: 1px solid var(--ink); font-weight: 500; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .bs-page p { margin: 0 0 10px; font-size: 16px; line-height: 1.55; color: var(--ink-2); }
  .bs-page ul { margin: 0; padding: 0; list-style: none; }
  .bs-page li { padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 16px; line-height: 1.5; color: var(--ink-2); }
  .bs-page li small { display: block; margin-top: 3px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .bs-page li b { font-weight: 500; color: var(--ink); }
  .bs-page a { color: var(--ink); }
  .bs-page li small a { color: var(--muted); }
  .bs-outils-page { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 18px 0 0; font-size: 14px; color: var(--muted); }
  .bs-interne { background: var(--band); padding: 2px 6px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .bs-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 48px; max-width: 1080px; margin: 0 auto; padding: 32px var(--gutter) 80px; }
  .bs-stat { padding: 22px 0 28px; border-top: 1px solid var(--ink); }
  .bs-stat h3 { margin: 0 0 6px; font-weight: 500; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .bs-stat p { margin: 0 0 18px; font-weight: 400; font-size: 22px; line-height: 1.25; letter-spacing: -0.015em; text-wrap: balance; }

      if (rep.status === 401) { arret('Session expirée : reconnectez-vous sur la carte, puis revenez.'); return; }
      if (rep.status === 403) { arret('Ce compte n\'a pas l\'accès premium : Argos est réservé aux abonnés.'); return; }
      if (rep.status === 429) { arret('Plafond de questions atteint pour aujourd\'hui, ou trop de questions d\'affilée.'); return; }
      if (!rep.ok || !rep.body) { arret('Argos ne répond pas (code ' + rep.status + ').'); return; }
      var lecteur = rep.body.getReader(), dec = new TextDecoder(), reste = '', fin = null;
      for (;;) {
        var lu = await lecteur.read(); if (lu.done) break;
        if (monJeu !== jeu) { lecteur.cancel(); return; }
        reste += dec.decode(lu.value, { stream: true });
        var blocs = reste.split('\n\n'); reste = blocs.pop();
        blocs.forEach(function (bl) {
          var ev = (bl.match(/^event: (.*)$/m) || [])[1], d = (bl.match(/^data: (.*)$/m) || [])[1]; if (!ev || !d) return;
          var donnee = JSON.parse(d);
          if (ev === 'extraits') {
            var pe = $('bs-pan-etape'); if (pe) pe.textContent = donnee.length + ' extraits retrouvés, rédaction';
            etat(donnee.length + ' extraits retrouvés, rédaction de la réponse', true);
            argosDonnees.extraits = donnee;
            donnee.forEach(function (x) { if (x.categorie === 'humint') nbH++; else nbS++; });
            /* les agents piochent dans leur socle, à partir de la question et des métadonnées des extraits (jamais leur texte) */
            fetch(EN_LIGNE ? URL_AGENTS : '/api/pioche', { method: 'POST', headers: EN_LIGNE ? { Authorization: 'Bearer ' + j, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: question, extraits: donnee.map(function (x) { return { type: x.type, lieu: x.lieu, pays: x.pays, date: x.date }; }) }) })
              .then(function (r) { return r.ok ? r.json() : null; }).then(function (j2) {
                if (!j2 || monJeu !== jeu) return;
                argosDonnees.agents = j2.agents;
                Object.keys(j2.agents).forEach(function (cle) { if (agents[cle]) surEvenement(Object.assign({ type: 'agent', cle: cle, requetes: [], synthese: '', date: j2.date }, j2.agents[cle])); });
              }).catch(function () {});
            donnee.forEach(function (x, k) {
              setTimeout(function () {
                if (monJeu !== jeu) return;
                var hum = x.categorie === 'humint', n2;
                if (hum) { n2 = noeud('fait', 0, 0, svgPicto(pictoDuType(x.type)), maj(x.type) || 'Fait', [x.pays, x.date].filter(Boolean).join(' · '), B.surikat); n2.el.setAttribute('data-etat', x.statut === 'corrobore' ? 'trouve' : 'partiel'); marque(n2, String(x.n), STATUTS_ARGOS[x.statut] || ''); }
                else { var ti = x.titre || STATUTS_ARGOS[x.statut] || 'Source'; n2 = noeud('source', 0, 0, '<b>' + String(x.n) + '</b>', ti, x.date || '', B.veille, true); n2.el.setAttribute('data-verif', 'validee'); }
                n2.donnees = { argos: x, cite: false, faits: [] }; n2.el.setAttribute('data-argos', ''); parN[x.n] = n2;
                (texte.match(/\[(\d{1,3}(?:,\s*\d{1,3})*)\]/g) || []).join(',').replace(/\d+/g, function (num) { if (parN[num]) { parN[num].donnees.cite = true; parN[num].el.setAttribute('data-cite', ''); } });
              }, k * 140);
            });
          } else if (ev === 'texte') {
            texte += donnee.t; ecrireArgos(texte, parN);
            (donnee.t.match(/\d{1,3}(?=[\],])/g) || []).forEach(function (num) { if (parN[num]) { parN[num].donnees.cite = true; parN[num].el.setAttribute('data-cite', ''); } });
          } else if (ev === 'fin') fin = donnee;
          else if (ev === 'erreur') texte += (texte ? '\n' : '') + 'Incident : ' + donnee.message;
        });
      }
      ecrireArgos(texte, parN);
      argosDonnees.texte = texte; argosDonnees.cites = (fin && Array.isArray(fin.cites) && fin.cites.length && typeof fin.cites[0] === 'number') ? fin.cites.slice() : [];
      (texte.match(/\[(\d{1,3}(?:,\s*\d{1,3})*)\]/g) || []).join(',').replace(/\d+/g, function (num) { num = Number(num); if (argosDonnees.cites.indexOf(num) < 0) argosDonnees.cites.push(num); }); argosDonnees.fin = fin || { issue: 'interrompu' };
      /* les trois résultats s'allument sur l'arbre */
      [['note', 'Notes'], ['carte', 'Cartographie'], ['stats', 'Statistiques']].forEach(function (x) { if (B[x[0]]) { B[x[0]].el.setAttribute('data-etat', 'trouve'); libelle(B[x[0]], x[1], 'ouvrir'); } });
      var ISSUES = { repondu: 'réponse citée', non_documente: 'le corpus ne documente pas ce point', refus_source: 'question refusée : elle vise une source protégée', hors_champ: 'question hors du champ d\'Argos', refuse_citation: 'réponse écartée par le vérificateur de citations' };
      var cites = argosDonnees.cites.length;
      terminer('Argos : ' + (nbH + nbS) + ' extraits retrouvés (' + nbH + ' de terrain, ' + nbS + ' sources et veille), ' + cites + ' cités. ' + (fin ? maj(ISSUES[fin.issue] || fin.issue) + '.' : 'Flux interrompu.') + (fin && fin.rejets ? ' ' + fin.rejets + ' phrase' + (fin.rejets > 1 ? 's' : '') + ' écartée' + (fin.rejets > 1 ? 's' : '') + ' par le vérificateur.' : '') + (fin && fin.quota_restant !== null && fin.quota_restant !== undefined ? ' Questions restantes aujourd\'hui : ' + fin.quota_restant + '.' : ''));
    } catch (e) { arret('Argos est injoignable depuis cette machine (' + e.message + ').'); }
  }
  function poser(posee) {
    if (EN_LIGNE || moteur === 'argos') { var qa = String(posee || $('bs-question').value || '').trim(); if (qa.length >= 3) lancerArgos(qa); return; }
    var q = $('bs-question').value.trim();
    if (q.length < 12) return;
    return lancerFlux('/api/question', { question: q }, 'Bulletins récents', 'Lecture de la question');
  }
  async function lancerFlux(adresse, corps, sous, premier) {
    ouvrirToile(sous);
    etat(premier, true);
    var monJeu = jeu, fini = false, avis = '', avisQ = '';
    await attendre(1700);   /* le temps que le squelette se dessine */
    try {
      var rep = await fetch(adresse, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
      if (!rep.ok || !rep.body) throw new Error('moteur');
      var lecteur = rep.body.getReader(), dec = new TextDecoder(), tampon = '';
      while (true) {
        var bloc = await lecteur.read();
        if (bloc.done) break;
        if (monJeu !== jeu) { lecteur.cancel(); return; }
        tampon += dec.decode(bloc.value, { stream: true });
        var lignes = tampon.split('\n'); tampon = lignes.pop();
        lignes.forEach(function (l) {
          if (!l.trim()) return;
          var ev = JSON.parse(l);
          if (ev.type === 'fin') { fini = true; surEvenement(ev); terminer('Terminé en ' + ev.duree_s + ' s. ' + avisQ + maj(bilan()) + '.' + (avis ? ' ' + avis : '')); }
          else if (ev.type === 'avis') { avis = ev.texte; }
          else if (ev.type === 'avis_recherche') { avis = 'Recoupement : ' + ev.veille + ' fait' + (ev.veille > 1 ? 's' : '') + ' par la veille déjà collectée (' + ev.corpus + ' faits en réserve), ' + ev.web + ' envoyé' + (ev.web > 1 ? 's' : '') + ' au web. ' + avis; }
          else if (ev.type === 'avis_question') { avisQ = 'Question : ' + ev.faits + ' fait' + (ev.faits > 1 ? 's' : '') + ' de terrain sur la zone dans ' + ev.bulletins + ' bulletin' + (ev.bulletins > 1 ? 's' : '') + ' récent' + (ev.bulletins > 1 ? 's' : '') + ' (' + ev.jours + ' derniers jours), ' + ev.presse + ' article' + (ev.presse > 1 ? 's' : '') + ' de veille. '; }
          else if (ev.type === 'erreur') { fini = true; terminer(ev.texte); }
          else surEvenement(ev);
        });
      }
      if (!fini) terminer('Recherche interrompue avant la fin.');
    } catch (e) {
      if (monJeu === jeu) terminer('Moteur injoignable. Lancez le serveur du bac à sable (serveur.mjs), ou rejouez la démonstration.');
    }
  }

  /* démonstration : rejoue, avec des délais, le résultat réel obtenu le 18/11 sur le bulletin fictif */
  async function rejouer() {
    var d = await fetch('exemple.json').then(function (r) { return r.json(); });
    ouvrirToile('Démonstration');
    var monJeu = jeu, vivant = function () { return monJeu === jeu; };
    etat('Démonstration : lecture du bulletin', true);
    await attendre(2300); if (!vivant()) return;
    surEvenement({ type: 'faits', faits: d.faits });
    await attendre(1700);
    var suivant = 0;
    async function ouvrier() {
      while (suivant < d.faits.length && vivant()) {
        var f = d.faits[suivant++];
        surEvenement({ type: 'recherche', id: f.id });
        await attendre(1500 + Math.random() * 1400); if (!vivant()) return;
        surEvenement({ type: 'sources', id: f.id, raison: f.raison, texte_publiable: f.texte_publiable, sources: f.sources });
        if (f.sources.length) {
          await attendre(2200); if (!vivant()) return;
          surEvenement({ type: 'verification_debut', id: f.id });
          await attendre(2600); if (!vivant()) return;
          var forme = function (s) { return { url: s.url, confirme: s.confirme, raison: s.motif, fetch_ok: s.ouverte }; };
          surEvenement({ type: 'verification', id: f.id, validees: f.sources.filter(function (s) { return s.confirme; }).map(forme), rejetees: f.sources.filter(function (s) { return !s.confirme; }).map(forme) });
        }
      }
    }
    await Promise.all([ouvrier(), ouvrier()]);
    if (!vivant()) return;
    etat('Démonstration : les agents IA se documentent', true);
    await Promise.all(AGENTS.map(async function (a, i) {
      await attendre(300 + i * 250); if (!vivant()) return;
      surEvenement({ type: 'agent_debut', cle: a.cle });
      await attendre(1200); if (!vivant()) return;
      var r = (d.agents || {})[a.cle] || { synthese: '', connaissances: [], non_evaluable: 'Absent de la démonstration.' };
      surEvenement({ type: 'agent_requetes', cle: a.cle, requetes: r.requetes || [] });
      await attendre(2200 + Math.random() * 2200); if (!vivant()) return;
      surEvenement(Object.assign({ type: 'agent', cle: a.cle }, r));
    }));
    if (vivant()) { await attendre(900); surEvenement({ type: 'fin' }); terminer('Démonstration terminée. ' + maj(bilan()) + '.'); }
  }

  $('bs-lancer').addEventListener('click', chercher);

  $('bs-rejouer').addEventListener('click', rejouer);
  $('bs-exemple').addEventListener('click', function () {
    fetch('bulletin-fictif-novembre.txt').then(function (r) { return r.text(); }).then(function (t) { $('bs-texte').value = t; $('bs-texte').focus(); });
  });
  /* fichier : lu par le serveur local, son texte est versé dans la zone pour que vous le voyiez avant de lancer */
  async function lireFichier(f) {
    if (!f) return;
    $('bs-note').textContent = 'Lecture de ' + f.name + '…';
    try {
      var rep = await fetch('/api/lire?nom=' + encodeURIComponent(f.name), { method: 'POST', body: f });
      var j = await rep.json();
      if (!rep.ok) throw new Error(j.erreur || 'lecture impossible');
      $('bs-texte').value = j.texte;
      $('bs-note').textContent = f.name + ' lu : ' + j.texte.length.toLocaleString('fr-FR') + ' caractères. Relisez, puis lancez la recherche.';
    } catch (e) { $('bs-note').textContent = 'Fichier non lu : ' + e.message; }
  }
  /* bulletins récents du dossier Téléchargements : un clic verse le texte dans la zone */
  if (!EN_LIGNE) fetch('/api/bulletins').then(function (r) { return r.json(); }).then(function (j) {
    if (!(j.bulletins || []).length) return;
    var zone = $('bs-recents'); zone.hidden = false; zone.appendChild(document.createTextNode('Bulletins récents :'));
    j.bulletins.forEach(function (b) {
      var court = (b.nom.match(/S\d{1,2}/i) || [b.nom.replace(/\.[a-z]+$/i, '').slice(0, 28)])[0];
      var bouton = el('button', { type: 'button', title: b.nom + ' · modifié le ' + jour(b.modifie), text: court });
      bouton.addEventListener('click', async function () {
        $('bs-note').textContent = 'Lecture de ' + b.nom + '…';
        try { var x = await fetch('/api/bulletin?nom=' + encodeURIComponent(b.nom)).then(function (r) { return r.json(); }); if (x.erreur) throw new Error(x.erreur);
          $('bs-texte').value = x.texte; $('bs-note').textContent = b.nom + ' lu : ' + x.texte.length.toLocaleString('fr-FR') + ' caractères. Choisissez un pays si le bulletin est long, puis lancez la recherche.'; }
        catch (e) { $('bs-note').textContent = 'Bulletin non lu : ' + e.message; }
      });
      zone.appendChild(bouton);
    });
  }).catch(function () {});
  $('bs-fichier').addEventListener('click', function () { $('bs-fichier-champ').click(); });
  $('bs-fichier-champ').addEventListener('change', function () { lireFichier(this.files[0]); this.value = ''; });
  $('bs-texte').addEventListener('dragover', function (e) { e.preventDefault(); });
  $('bs-texte').addEventListener('drop', function (e) { if (e.dataTransfer.files.length) { e.preventDefault(); lireFichier(e.dataTransfer.files[0]); } });

  $('bs-nouveau').addEventListener('click', function () {
    try { localStorage.removeItem('algor-enquete'); } catch (e) {}   /* les faits passés à la carte ne restent pas dans le navigateur */
    $('bs-carte').removeAttribute('src');
    accueil();
  });
  $('bs-rech-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = $('bs-rech-champ').value.trim();
    if (q.length < (moteur === 'argos' ? 3 : 12)) { $('bs-rech-cadre').textContent = 'Écrivez votre question en nommant la zone : un pays, une ville, un axe.'; $('bs-rech-champ').focus(); return; }
    $('bs-question').value = q; poser(q); $('bs-rech-champ').blur();
  });
  $('bs-rech-idees').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; $('bs-rech-champ').value = b.textContent; $('bs-rech-form').requestSubmit(); });
  $('bs-rech-moteur').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; moteur = b.getAttribute('data-moteur'); this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); $('bs-rech-champ').focus(); });
  $('bs-rech-flux').addEventListener('click', function () { jeu++; toile.hidden = true; $('bs-saisie').hidden = false; });
  $('bs-retour-question').addEventListener('click', accueil);
  $('bs-retour').addEventListener('click', function () { montrerVue('graphe'); });


  /* le bouton de vraie recherche n'est actif que si le moteur local répond */
  if (!EN_LIGNE) fetch('/api/etat').then(function (r) { return r.json(); }).then(function (e) {
    if (!(e.moteur && e.mistral && e.recherche)) throw 0;
    if (e.recherche_web && !e.recherche_web.ok) $('bs-note').textContent = 'Attention : recherche web indisponible, ' + e.recherche_web.detail + '. Le recoupement ne passera que par la presse suivie et les sources locales.';
  }).catch(function () {
    $('bs-lancer').disabled = true;
    $('bs-note').textContent = 'Moteur local absent ou clés manquantes : seule la démonstration est disponible.';
  });
  accueil();
})();
</script>
